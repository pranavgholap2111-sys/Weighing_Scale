<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poultry Scale #01 - Smart Trade Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- External Libraries -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .container {
      background: var(--card-bg);
      max-width: 450px;
      width: 100%;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .header-tag {
      display: inline-block;
      background: #0284c720;
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h2 { margin: 0 0 5px 0; font-size: 1.5rem; }
    
    .status-badge {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
    }
    .pulse-dot.online { background-color: var(--accent-green); }

    .weight-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .weight-label { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; }
    .weight-value { font-size: 3.8rem; font-weight: 800; color: var(--accent-green); line-height: 1.1; margin: 10px 0; }
    .weight-unit { font-size: 1.2rem; color: var(--text-sub); }

    .btn-trade {
      background: var(--accent-green);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-trade:active { transform: scale(0.98); }
    .btn-trade:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

    #logStatus { margin-top: 12px; font-weight: 600; font-size: 0.9rem; min-height: 20px; }
    .divider { margin: 25px 0; border-top: 1px dashed #334155; }

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-title { font-size: 0.85rem; color: var(--text-sub); }

    #qrcode {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
    }

    .sheet-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .sheet-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <span class="header-tag">Farm Telemetry</span>
    <h2>Poultry Scale #01</h2>
    
    <div class="status-badge">
      <span id="dot" class="pulse-dot"></span>
      <span id="statusText">Connecting to Broker...</span>
    </div>

    <div class="weight-card">
      <div class="weight-label">Live Weight Payload</div>
      <div class="weight-value"><span id="weightVal">0.00</span> <span class="weight-unit">kg</span></div>
    </div>

    <button id="tradeBtn" class="btn-trade" onclick="recordTrade()">RECORD TRADE</button>
    <div id="logStatus"></div>

    <div class="divider"></div>

    <!-- QR Code & Direct Link Section -->
    <div class="qr-section">
      <div class="qr-title">Scan or Click to view Live Trade Sheet</div>
      <div id="qrcode"></div>
      <a id="sheetDirectLink" href="#" target="_blank" class="sheet-link">
        📊 Open Google Spreadsheet ↗
      </a>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION - REPLACE WITH YOUR ACTUAL URLS
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxK-B1N2J91K2ENR8ppP7_GpX0teU_aWoVzbSH3IJ6V_qqqv64lRMCBcPNM3SFua_IlA/exec";
    const GOOGLE_SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/12F8PGXFhhDYAN5ZwQyix-_qo94PzpL9Ppu9bGWbf7bE/edit?pli=1&gid=0#gid=0"; 
    
    const SCALE_ID = "SCALE-S3-01";
    const LOCATION = "Poultry Shed 1";

    let tradeCounter = 1;
    let currentWeight = "0.00";

    // Initialize QR Code & Link
    document.getElementById("sheetDirectLink").href = GOOGLE_SHEET_VIEW_URL;
    new QRCode(document.getElementById("qrcode"), {
      text: GOOGLE_SHEET_VIEW_URL,
      width: 110,
      height: 110
    });

    // Connect to HiveMQ Public Broker via Secure WebSockets
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      document.getElementById('dot').classList.add('online');
      document.getElementById('statusText').innerText = 'Scale Connected (Live)';
      client.subscribe('smartscale/telemetry/weight');
    });

    client.on('message', (topic, message) => {
      let grams = parseFloat(message.toString());
      currentWeight = (grams / 1000.0).toFixed(2);
      document.getElementById('weightVal').innerText = currentWeight;
    });

    client.on('error', () => {
      document.getElementById('dot').classList.remove('online');
      document.getElementById('statusText').innerText = 'Connection Error';
    });

    async function recordTrade() {
      const btn = document.getElementById('tradeBtn');
      const statusDiv = document.getElementById('logStatus');
      
      btn.disabled = true;
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Saving Trade Record...';

      const now = new Date();
      const payload = {
        trade_id: 'TRD-' + String(tradeCounter).padStart(4, '0'),
        date: now.toISOString().split('T')[0],
        time: now.toTimeString().split(' ')[0],
        scale_id: SCALE_ID,
        location: LOCATION,
        weight_kg: parseFloat(currentWeight)
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = `Trade #${tradeCounter} Logged Successfully!`;
        tradeCounter++;
      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Error Saving Record!';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          statusDiv.innerText = '';
        }, 2000);
      }
    }
  </script>
</body>
</html>
