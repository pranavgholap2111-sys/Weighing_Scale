<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poultry Scale Cloud Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
    .card { background: #1e293b; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; margin-top: 0; }
    .status { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    .weight-box { font-size: 3.5rem; font-weight: bold; color: #4ade80; margin: 20px 0; }
    .btn-trade { background: #22c55e; color: #ffffff; font-size: 1.25rem; font-weight: bold; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-trade:active { transform: scale(0.98); background: #16a34a; }
    .btn-trade:disabled { background: #475569; cursor: not-allowed; }
    #logStatus { margin-top: 15px; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Poultry Scale #01</h2>
    <div id="status" class="status">Connecting to Scale...</div>
    <div>Live Weight</div>
    <div class="weight-box"><span id="weightVal">0.00</span> kg</div>

    <button id="tradeBtn" class="btn-trade" onclick="recordTrade()">RECORD TRADE</button>
    <div id="logStatus"></div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL_HERE";
    const SCALE_ID = "SCALE-S3-01";
    const LOCATION = "Poultry Shed 1";
    let tradeCounter = 1;
    let currentWeight = "0.00";

    // Connect to HiveMQ Public Broker
    const client = mqtt.connect('ws://broker.hivemq.com:8000/mqtt');

    client.on('connect', () => {
      document.getElementById('status').innerText = 'Status: Scale Connected (Live)';
      document.getElementById('status').style.color = '#4ade80';
      client.subscribe('smartscale/telemetry/weight');
    });

    client.on('message', (topic, message) => {
      let grams = parseFloat(message.toString());
      currentWeight = (grams / 1000.0).toFixed(2);
      document.getElementById('weightVal').innerText = currentWeight;
    });

    async function recordTrade() {
      const btn = document.getElementById('tradeBtn');
      const statusDiv = document.getElementById('logStatus');
      
      btn.disabled = true;
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Saving Trade Record...';

      const now = new Date();
      const payload = {
        trade_id: 'TRD-' + String(tradeCounter).padStart(4, '0'),
        date: now.toISOString().split('T')[0],
        time: now.toTimeString().split(' ')[0],
        scale_id: SCALE_ID,
        location: LOCATION,
        weight_kg: parseFloat(currentWeight)
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = `Trade #${tradeCounter} Logged Successfully!`;
        tradeCounter++;
      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Error Saving Record!';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          statusDiv.innerText = '';
        }, 2000);
      }
    }
  </script>
</body>
</html>
